# Download the latest stable Waze from APKMirror, patch it (tools/apkmirror.py + patch.sh) and publish the APK.
# Pull requests: build and keep the APK as a workflow artifact. main (push or manual run): also a GitHub release.
#
# Repository secrets:
#   JCONFIG_APK_URL   where to fetch the JConfig build whose cluster patches are ported (required on main;
#                     a pull request without it builds the notification-only variant)
#   KEYSTORE_B64      base64 of the signing keystore (required on main, so every release updates over the last;
#                     a pull request without it signs with a throwaway key)
#   KEYSTORE_PASSWORD its store/key password (default wazepatch); alias wazepatch
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      APKTOOL_VERSION: 3.0.3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Android build tools and apktool
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" "platforms;android-36" >/dev/null
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_ENV"
          echo "ANDROID_JAR=$ANDROID_HOME/platforms/android-36/android.jar" >> "$GITHUB_ENV"
          curl -fsSL -o "$RUNNER_TEMP/apktool.jar" \
            "https://github.com/iBotPeaches/Apktool/releases/download/v$APKTOOL_VERSION/apktool_$APKTOOL_VERSION.jar"
          echo "APKTOOL=$RUNNER_TEMP/apktool.jar" >> "$GITHUB_ENV"

      - name: Download the latest Waze from APKMirror
        id: waze
        run: |
          python -I tools/apkmirror.py "$RUNNER_TEMP/in" | tee "$RUNNER_TEMP/apkmirror.log"
          echo "version=$(tail -1 "$RUNNER_TEMP/apkmirror.log")" >> "$GITHUB_OUTPUT"

      - name: JConfig build and signing key
        env:
          JCONFIG_APK_URL: ${{ secrets.JCONFIG_APK_URL }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$JCONFIG_APK_URL" ]; then
            curl -fsSL -o "$RUNNER_TEMP/jconfig.apk" "$JCONFIG_APK_URL"
            echo "JCONFIG=$RUNNER_TEMP/jconfig.apk" >> "$GITHUB_ENV"
          elif [ "$RELEASE" = true ]; then
            echo "::error::JCONFIG_APK_URL secret is not set"; exit 1
          else
            echo "::warning::no JCONFIG_APK_URL: building the notification-only variant"
          fi
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "::add-mask::${KEYSTORE_PASSWORD:-wazepatch}"
            echo "KS_PASS=${KEYSTORE_PASSWORD:-wazepatch}" >> "$GITHUB_ENV"
          elif [ "$RELEASE" = true ]; then
            echo "::error::KEYSTORE_B64 secret is not set"; exit 1
          else
            echo "KEYSTORE=$RUNNER_TEMP/throwaway.keystore" >> "$GITHUB_ENV"   # patch.sh creates it
          fi

      - name: Patch
        env:
          VERSION: ${{ steps.waze.outputs.version }}
        run: |
          OUT="$RUNNER_TEMP/out/waze-$VERSION-carlosrpg.apk"
          mkdir -p "$(dirname "$OUT")"
          bash patch.sh "$RUNNER_TEMP/in/waze-$VERSION.apk" "$OUT"
          echo "APK=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: waze-${{ steps.waze.outputs.version }}-carlosrpg
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: Release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.waze.outputs.version }}
        run: |
          TAG="waze-$VERSION-build${{ github.run_number }}"
          printf '%s\n' "Waze $VERSION (latest stable on APKMirror) with the JConfig cluster patches ported, the" \
            "turn-by-turn notification and the cluster turn box, as com.carlosrpg.waze (installs next to Waze)." \
            "" "Patcher commit: $GITHUB_SHA" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "Waze $VERSION (build ${{ github.run_number }})" \
            --notes-file "$RUNNER_TEMP/notes.md"
