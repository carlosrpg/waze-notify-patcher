# Download the latest stable Waze from APKMirror, patch it (tools/apkmirror.py + patch.sh) and publish the APK.
# Pull requests: build and keep the APK as a workflow artifact. main (push or manual run): also a GitHub release.
#
# The JConfig cluster patches are ported from jconfig/ in this repository.
# Repository secrets (the same signing key as the other car apps; required on main so every release installs over
# the last; a pull request without them, e.g. from a fork, signs with a throwaway key):
#   RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      APKTOOL_VERSION: 3.0.3
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Android build tools and apktool
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" "platforms;android-36" >/dev/null
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_ENV"
          echo "ANDROID_JAR=$ANDROID_HOME/platforms/android-36/android.jar" >> "$GITHUB_ENV"
          curl -fsSL -o "$RUNNER_TEMP/apktool.jar" \
            "https://github.com/iBotPeaches/Apktool/releases/download/v$APKTOOL_VERSION/apktool_$APKTOOL_VERSION.jar"
          echo "APKTOOL=$RUNNER_TEMP/apktool.jar" >> "$GITHUB_ENV"

      - name: Download the latest Waze from APKMirror
        id: waze
        run: |
          set -o pipefail   # a failed download stops here, not in the next step
          python -I tools/apkmirror.py "$RUNNER_TEMP/in" | tee "$RUNNER_TEMP/apkmirror.log"
          echo "version=$(tail -1 "$RUNNER_TEMP/apkmirror.log")" >> "$GITHUB_OUTPUT"

      - name: Signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            {
              echo "KEYSTORE=$RUNNER_TEMP/release.keystore"
              echo "KS_PASS=$RELEASE_STORE_PASSWORD"
              echo "KS_ALIAS=$RELEASE_KEY_ALIAS"
              echo "KEY_PASS=$RELEASE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          elif [ "$RELEASE" = true ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set"; exit 1
          else
            echo "::warning::no signing secrets: signing with a throwaway key"
            echo "KEYSTORE=$RUNNER_TEMP/throwaway.keystore" >> "$GITHUB_ENV"   # patch.sh creates it
          fi

      - name: Patch
        env:
          VERSION: ${{ steps.waze.outputs.version }}
          # the release tag's build number, which the app's update check compares; 0 = never ask (pull requests)
          BUILD_NUMBER: ${{ env.RELEASE == 'true' && github.run_number || 0 }}
        run: |
          OUT="$RUNNER_TEMP/out/waze-$VERSION-carlosrpg.apk"
          mkdir -p "$(dirname "$OUT")"
          bash patch.sh "$RUNNER_TEMP/in/waze-$VERSION.apk" "$OUT"
          echo "APK=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: waze-${{ steps.waze.outputs.version }}-carlosrpg
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: Release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.waze.outputs.version }}
        run: |
          TAG="waze-$VERSION-build${{ github.run_number }}"
          printf '%s\n' "Waze $VERSION (latest stable on APKMirror) with the JConfig cluster patches ported, the" \
            "turn-by-turn notification and the cluster turn box, as com.carlosrpg.waze (installs next to Waze)." \
            "" "Patcher commit: $GITHUB_SHA" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "Waze $VERSION (build ${{ github.run_number }})" \
            --notes-file "$RUNNER_TEMP/notes.md"
